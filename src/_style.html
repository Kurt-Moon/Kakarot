<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#1A2744;--navy2:#253656;--coral:#E84057;--coral2:#c63247;
  --teal:#00A9A5;--teal2:#007C79;--teal-wash:#E6F6F6;
  --amber:#F59E0B;--green:#22C55E;
  --bg:#F5F5F5;--card:#FFFFFF;
  --border:#E8E8E8;--border2:#D0D0D0;
  --t1:#1D1D1F;--t2:#6E6E73;--t3:#AEAEB2;
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow2:0 6px 20px rgba(0,0,0,.11);
  --r:10px;--r2:14px;
  --coral-g:linear-gradient(135deg,#E84057 0%,#FF5E3A 100%);
  --navy-g:linear-gradient(135deg,#1A2744 0%,#253656 100%);
}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.65}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--teal)}

/* ── HERO ── */
.hero{background:linear-gradient(140deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:4rem 2rem 7rem;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;right:-80px;width:360px;height:360px;background:radial-gradient(circle,rgba(233,69,96,.22) 0%,transparent 70%);pointer-events:none}
.hero-logo{font-size:2.6rem;font-weight:900;letter-spacing:-.04em;margin-bottom:.6rem}
.hero-logo span{color:var(--coral)}
.hero-sub{opacity:.78;font-size:1.125rem;margin-bottom:2.8rem;line-height:1.7}
.hero-search{max-width:560px;margin:0 auto;position:relative}
.hero-search input{width:100%;padding:1.1rem 1.4rem 1.1rem 3.2rem;border:none;border-radius:var(--r);font-size:1rem;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.22);outline:none}
.hero-search .si{position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);font-size:1.2rem;pointer-events:none}
.search-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:var(--r);box-shadow:var(--shadow2);max-height:320px;overflow-y:auto;z-index:200}
.sdrop-item{padding:1rem 1.4rem;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:.9rem;transition:background .15s}
.sdrop-item:hover{background:var(--bg)}
.sdrop-item:last-child{border-bottom:none}

/* ── SECTION ── */
.sec{padding:4rem 0}
.sec-white{background:#fff}
.container{max-width:1200px;margin:0 auto;padding:0 1.5rem}
.sec-hd{margin-bottom:2rem}
.sec-title{font-size:1.65rem;font-weight:900;margin-bottom:.4rem}
.sec-sub{color:var(--t2);font-size:.9rem}

/* ── CITY CARDS ── */
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem}
.city-card{background:#fff;border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s,box-shadow .25s;position:relative}
.city-card:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(233,69,96,.16)}
.city-card img{width:100%;height:160px;object-fit:cover}
.city-card-body{padding:1.2rem}
.city-card-name{font-size:1.2rem;font-weight:900;margin-bottom:.3rem}
.city-card-meta{font-size:.8rem;color:var(--t3)}
.badge-avail{position:absolute;top:.8rem;right:.8rem;background:var(--coral-g);color:#fff;font-size:.72rem;font-weight:700;padding:.25rem .7rem;border-radius:2rem;box-shadow:0 2px 8px rgba(233,69,96,.35)}

/* ── REGION CHIPS ── */
.region-section{margin-bottom:2.5rem}
.region-label{font-size:1rem;font-weight:700;margin-bottom:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{background:#fff;border:2px solid var(--border);padding:.55rem 1rem;border-radius:2rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.45rem;font-size:.88rem;font-weight:600}
.chip:hover{border-color:var(--coral);background:rgba(233,69,96,.06);transform:translateY(-2px);box-shadow:0 4px 12px rgba(233,69,96,.12)}
.chip.disabled{opacity:.5;cursor:not-allowed}
.chip.disabled:hover{transform:none;border-color:var(--border);background:#fff}
.chip-soon{font-size:.65rem;color:var(--t3);font-weight:400}
.chip-cnt{background:var(--bg);padding:.1rem .45rem;border-radius:1rem;font-size:.65rem;color:var(--t2)}

/* ── SETUP ── */
.setup-wrap{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem}
.setup-panel{background:#fff;border-radius:var(--r2);padding:2.8rem;max-width:680px;width:100%;box-shadow:0 24px 64px rgba(26,26,46,.14)}
.step-bar{display:flex;gap:.4rem;margin-bottom:2rem}
.step-dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.step-dot.done{background:var(--coral)}
.setup-eyebrow{color:var(--coral);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.6rem}
.setup-title{font-size:1.9rem;font-weight:900;margin-bottom:.5rem}
.setup-sub{color:var(--t2);margin-bottom:2rem;line-height:1.6}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.9rem;margin-bottom:1.6rem}
.opt-card{border:2px solid var(--border);border-radius:var(--r);padding:1.4rem 1rem;text-align:center;cursor:pointer;transition:all .2s}
.opt-card:hover{border-color:var(--coral);transform:translateY(-3px);box-shadow:0 6px 20px rgba(233,69,96,.1)}
.opt-card.sel{border-color:var(--coral);background:rgba(233,69,96,.08)}
.opt-icon{font-size:2.2rem;margin-bottom:.6rem}
.opt-name{font-weight:700;font-size:1rem}
.opt-desc{color:var(--t2);font-size:.8rem;margin-top:.25rem}
.dur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.8rem;margin-bottom:1.6rem}
.dur-card{border:2px solid var(--border);border-radius:var(--r);padding:1.2rem .8rem;text-align:center;cursor:pointer;transition:all .2s}
.dur-card:hover{border-color:var(--coral)}
.dur-card.sel{border-color:var(--coral);background:rgba(233,69,96,.08)}
.dur-num{font-size:1.8rem;font-weight:900;color:var(--coral);font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.dur-lbl{font-size:.8rem;color:var(--t2)}
.date-row{display:flex;align-items:center;gap:.8rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.2rem;margin-bottom:1.6rem;flex-wrap:wrap}
.date-row label{font-size:.85rem;font-weight:600;color:var(--t2)}
.date-row input[type=date]{padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:.9rem;background:#fff}
.pkg-note{background:var(--teal-wash);border:1px solid rgba(15,122,111,.2);color:var(--teal2);font-size:.83rem;padding:.9rem 1.1rem;border-radius:var(--r);margin-bottom:1.4rem;line-height:1.6}
.btn-main{width:100%;background:var(--navy-g);color:#fff;padding:1.1rem;border:none;border-radius:var(--r);font-weight:700;font-size:1rem;transition:all .2s;letter-spacing:.01em}
.btn-main:hover{background:linear-gradient(135deg,#243557 0%,#3a5490 100%);transform:translateY(-2px);box-shadow:0 6px 20px rgba(28,43,74,.3)}
.btn-main:disabled{background:var(--border);cursor:not-allowed;transform:none}
.btn-back{background:none;border:none;color:var(--t2);font-size:.88rem;padding:.4rem .6rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.3rem}
.btn-back:hover{color:var(--navy)}

/* ── HOME NAV ── */
.home-nav{background:rgba(20,31,56,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:300;padding:0 2rem;height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07)}
.home-nav-links{display:flex;align-items:center;gap:.25rem}
.home-nav-links a{color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem;font-weight:600;padding:.45rem .8rem;border-radius:6px;transition:all .2s;cursor:pointer}
.home-nav-links a:hover{color:#fff;background:rgba(255,255,255,.1)}
.home-login-btn{background:var(--coral);color:#fff;border:none;padding:.45rem 1.1rem;border-radius:var(--r);font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s}
.home-login-btn:hover{background:#d63651;transform:translateY(-1px)}
.home-login-user{color:rgba(255,255,255,.75);font-size:.82rem;display:flex;align-items:center;gap:.5rem}
/* 이용방법 섹션 */
.how-to-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem;margin-top:2rem}
.how-to-card{background:#fff;border-radius:1rem;padding:1.8rem 1.4rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.how-to-num{width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;font-size:.85rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto .9rem}
.how-to-icon{font-size:2.2rem;margin-bottom:.6rem}
.how-to-ttl{font-weight:800;font-size:1rem;margin-bottom:.35rem}
.how-to-desc{font-size:.82rem;color:var(--t2);line-height:1.6}
/* date input 폰트 */
.date-row input[type=date]{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:.9rem;font-weight:600;background:#fff}
.return-date-row{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem;margin-top:-.8rem;margin-bottom:1.6rem;border-radius:var(--r);background:rgba(233,69,96,.06);border:1px solid rgba(233,69,96,.15)}
.return-date-row label{font-size:.82rem;font-weight:600;color:var(--coral)}
.return-date-row span{font-size:.9rem;font-weight:700;color:var(--navy)}
/* 커스텀 일수 입력 */
.custom-dur-wrap{display:flex;align-items:center;gap:.75rem;padding:.9rem 1.1rem;border:2px solid var(--coral);border-radius:var(--r);background:rgba(233,69,96,.05);margin-top:-.5rem;margin-bottom:1.6rem}
.custom-dur-wrap input{width:72px;padding:.45rem .6rem;border:1px solid var(--border);border-radius:8px;font-size:1.1rem;font-weight:700;text-align:center;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
/* ── NAVBAR ── */
.navbar{background:var(--navy);color:#fff;padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.nav-logo{font-size:1.4rem;font-weight:900;cursor:pointer;letter-spacing:-.02em}
.nav-logo span{color:var(--coral)}
.nav-center{display:flex;align-items:center;gap:.8rem;font-size:.82rem}
.nav-city{background:rgba(255,255,255,.1);padding:.3rem .8rem;border-radius:2rem;font-weight:600}
.nav-dates{opacity:.65}
.nav-actions{display:flex;align-items:center;gap:.6rem}
.nav-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:.4rem .9rem;border-radius:var(--r);font-size:.8rem;font-weight:600;transition:background .2s}
.nav-icon-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.85);width:34px;height:34px;border-radius:8px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;letter-spacing:.1em}
.nav-icon-btn:hover{background:rgba(255,255,255,.22);color:#fff}
.nav-save-btn{background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.4);color:#fff;padding:.4rem 1rem;border-radius:var(--r);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-save-btn:hover{background:rgba(34,197,94,.32)}
.nav-save-btn:disabled{opacity:.5;cursor:not-allowed}
.nav-login-btn{background:var(--coral-g);border:none;color:#fff;padding:.4rem 1rem;border-radius:var(--r);font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
.nav-profile-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex-shrink:0;transition:background .15s}
.nav-profile-btn img{width:100%;height:100%;object-fit:cover}
.nav-profile-btn:hover{background:rgba(255,255,255,.22)}
.nav-dropdown{position:absolute;top:calc(100% + .5rem);right:0;background:#fff;border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.18);min-width:168px;overflow:hidden;z-index:500;border:1px solid var(--border)}
.nav-dropdown button{display:flex;width:100%;align-items:center;gap:.55rem;padding:.65rem .9rem;background:none;border:none;font-size:.84rem;color:var(--t1);cursor:pointer;font-family:inherit;text-align:left;transition:background .12s;white-space:nowrap}
.nav-dropdown button:hover{background:var(--bg)}
.nav-dropdown .ndrop-div{height:1px;background:var(--border);margin:.25rem 0}
.nav-btn:hover{background:rgba(255,255,255,.22)}
.nav-btn.danger{background:rgba(233,69,96,.25)}
.nav-btn.danger:hover{background:var(--coral)}

/* ── BRIEFING ── */
.briefing{background:linear-gradient(140deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:1.4rem 1.5rem;margin-bottom:1.5rem}
.briefing-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr repeat(4,auto);gap:1rem;align-items:center;flex-wrap:wrap}
.brief-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:.9rem 1.1rem;min-width:130px}
.brief-lbl{font-size:.68rem;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.06em;opacity:.55;text-transform:uppercase;margin-bottom:.3rem}
.brief-val{font-size:1.2rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;color:#ff9a7e}
.brief-sub{font-size:.72rem;opacity:.5;margin-top:.2rem}
.brief-main{padding:0}
.brief-city{font-size:1.6rem;font-weight:900}
.brief-info{opacity:.6;font-size:.85rem;margin-top:.3rem}
.weather-pill{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.1);border-radius:2rem;padding:.3rem .8rem;font-size:.82rem;margin-top:.5rem}
.transport-rec{background:rgba(15,122,111,.25);border:1px solid rgba(15,122,111,.4);border-radius:var(--r);padding:.7rem 1rem;font-size:.8rem;line-height:1.5;margin-top:.6rem}
.transport-rec strong{color:#6ee7de}

/* ── BUDGET BAR ── */
.budget-bar{background:#fff;border-bottom:1px solid var(--border);padding:.6rem 1.5rem;position:sticky;top:56px;z-index:200;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.budget-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.budget-item{display:flex;align-items:center;gap:.4rem;font-size:.82rem}
.budget-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.budget-total{font-weight:900;font-size:1rem;margin-left:auto;color:var(--coral)}
.budget-note{font-size:.73rem;color:var(--t3)}

/* ── PLANNER LAYOUT ── */
.planner-wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem 3rem;display:grid;grid-template-columns:320px 1fr;gap:1.5rem;align-items:start}
.sidebar{background:#fff;border-radius:var(--r2);border:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:calc(56px + 42px + 1.5rem);max-height:calc(100vh - 180px);display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:1rem 1.1rem .6rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-filters{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.flt-btn{padding:.35rem .7rem;border-radius:2rem;border:1px solid var(--border);background:var(--bg);font-size:.73rem;font-weight:600;color:var(--t2);transition:all .2s}
.flt-btn:hover{border-color:var(--teal);color:var(--teal2)}
.flt-btn.act{background:var(--navy);border-color:var(--navy);color:#fff}
.area-scroll{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.4rem}
.area-scroll::-webkit-scrollbar{height:3px}
.area-btn{padding:.28rem .65rem;border-radius:2rem;border:1px solid var(--border);background:#fff;font-size:.7rem;font-weight:600;white-space:nowrap;color:var(--t2);transition:all .2s}
.area-btn:hover{border-color:var(--teal)}
.area-btn.act{background:var(--teal);border-color:var(--teal);color:#fff}
.place-search{width:100%;padding:.65rem .85rem;border:1px solid var(--border);border-radius:var(--r);font-size:.83rem;background:var(--bg);outline:none;transition:border-color .2s;margin-top:.5rem}
.place-search:focus{border-color:var(--teal);background:#fff}
.sidebar-list{overflow-y:auto;flex:1;padding:.8rem}
.place-card{border:2px solid var(--border);border-radius:var(--r);padding:.9rem;margin-bottom:.7rem;cursor:pointer;transition:all .2s;position:relative;background:#fff}
.place-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
.place-card.selected{border-color:var(--coral);background:rgba(233,69,96,.06)}
.place-card-top{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.5rem}
.place-img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.place-info{flex:1;min-width:0}
.place-name{font-weight:700;font-size:.9rem;line-height:1.3;margin-bottom:.2rem}
.place-area-tag{font-size:.7rem;color:var(--t3);margin-bottom:.3rem}
.place-tags{display:flex;flex-wrap:wrap;gap:.25rem}
.p-tag{font-size:.65rem;background:var(--teal-wash);color:var(--teal2);padding:.1rem .45rem;border-radius:.5rem;font-weight:600}
.place-meta{display:flex;align-items:center;gap:.7rem;font-size:.75rem;color:var(--t2)}
.place-meta .m{display:flex;align-items:center;gap:.2rem}
.place-tip{font-size:.75rem;color:var(--t2);margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--border);line-height:1.4}
.add-custom-btn{width:calc(100% - 1.6rem);margin:.4rem .8rem .8rem;background:var(--bg);border:1.5px dashed var(--border2);color:var(--t2);padding:.8rem;border-radius:var(--r);font-weight:600;font-size:.83rem;transition:all .2s}
.add-custom-btn:hover{border-color:var(--teal);color:var(--teal2);background:#fff}
.custom-form{margin:.4rem .8rem .8rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.9rem;display:flex;flex-direction:column;gap:.5rem}
.custom-form input,.custom-form select{padding:.6rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:.82rem;background:#fff}
.cf-row{display:flex;gap:.5rem}
.cf-submit{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:.65rem;font-weight:700;font-size:.83rem;width:100%}

/* ── MAIN PANEL ── */
.main-panel{display:flex;flex-direction:column;gap:1rem}
.day-tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.day-tab{padding:.55rem 1.1rem;border-radius:var(--r);border:2px solid var(--border);background:#fff;font-size:.83rem;font-weight:700;transition:all .2s}
.day-tab:hover{border-color:var(--coral)}
.day-tab.act{border-color:var(--coral);background:var(--coral);color:#fff}
.view-toggle{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.view-btn{background:var(--bg);border:1px solid var(--border);padding:.4rem .9rem;border-radius:var(--r);font-size:.78rem;font-weight:600;color:var(--t2);transition:all .2s}
.view-btn.act{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs-row{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}

/* ── DAY CARD ── */
.day-card{background:#fff;border-radius:var(--r2);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.day-header{background:var(--navy);color:#fff;padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between}
.day-header-left{display:flex;align-items:center;gap:.8rem}
.day-badge{background:var(--coral);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;flex-shrink:0}
.day-title{font-weight:900;font-size:1rem}
.day-date{opacity:.6;font-size:.78rem;margin-top:.1rem}
.day-header-actions{display:flex;gap:.5rem}
.day-act-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:.35rem .75rem;border-radius:8px;font-size:.75rem;font-weight:600;transition:background .2s}
.day-act-btn:hover{background:rgba(255,255,255,.24)}
.day-body{padding:1.1rem}
