            .planner-layout { grid-template-columns: 1fr; }
            .summary-panel { position: static; margin-top: 24px; min-width: 100%; }
        }
    </style>

        // URL 빌더 함수
        function buildTicketUrl(query) {

        // 통화 변환 (USD 피벗 방식 - 실제 서비스 적용시 실시간 환율 API로 교체 권장)
        const RATES_TO_USD = { JPY: 1 / 157, KRW: 1 / 1370, USD: 1, EUR: 1.08, CNY: 1 / 7.2, GBP: 1.27 };
        const CURRENCY_META = {
            JPY: { symbol: '¥', label: '🇯🇵 일본 (JPY)' },
            KRW: { symbol: '₩', label: '🇰🇷 대한민국 (KRW)' },
            USD: { symbol: '$', label: '🇺🇸 미국 (USD)' },
            EUR: { symbol: '€', label: '🇪🇺 유럽 (EUR)' },
            CNY: { symbol: '¥', label: '🇨🇳 중국 (CNY)' },
            GBP: { symbol: '£', label: '🇬🇧 영국 (GBP)' }
        };
        function convertCurrency(amount, from, to) {
            if (!amount || from === to) return amount || 0;
            return amount * (RATES_TO_USD[from] / RATES_TO_USD[to]);
        }
        function formatMoney(amount, code) {
            const meta = CURRENCY_META[code] || { symbol: '' };
            return `${meta.symbol}${Math.round(amount || 0).toLocaleString()}`;
        }

        // Haversine 거리 및 이동시간 계산 공식
        function haversineDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function calculateTransit(placeA, placeB) {
            if (!placeA || !placeB) return { km: 0, mins: 0, mode: '도보' };
            const dist = haversineDistance(placeA.lat, placeA.lng, placeB.lat, placeB.lng);
            if (dist < 1) return { km: dist, mins: Math.max(5, Math.round(dist * 15)), mode: '🚶 도보' };
            return { km: dist, mins: Math.round(dist * 4) + 10, mode: '🚇 대중교통' };
        }

        function incrementTime(time, minutesToAdd) {
            const [h, m] = (time || '09:00').split(':').map(Number);
            const total = ((h * 60 + m + minutesToAdd) % (24 * 60) + 24 * 60) % (24 * 60);
            const nh = Math.floor(total / 60), nm = total % 60;
            return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
        }

        // 동선 최적화 알고리즘 - 관광지(spot) 슬롯 간의 방문 순서를 최단 거리로 재배치
        // 소규모(n<=7)는 전수조사로 최단 경로 탐색, 그 이상은 최근접 이웃 휴리스틱(모든 시작점 시도)
        function optimizeDaySlots(slots) {
            const newSlots = slots.map(s => ({ ...s }));
            const spotIndices = newSlots.map((s, idx) => (s.item && s.item.category === 'spot' ? idx : null)).filter(v => v !== null);
            if (spotIndices.length < 2) return newSlots;

            const spotItems = spotIndices.map(i => newSlots[i].item);
            const n = spotItems.length;

            function routeDistance(order) {
                let total = 0;
                for (let i = 0; i < order.length - 1; i++) {
                    total += haversineDistance(
                        spotItems[order[i]].lat, spotItems[order[i]].lng,
                        spotItems[order[i + 1]].lat, spotItems[order[i + 1]].lng
                    );
                }
                return total;
            }

            function permutations(arr) {
                if (arr.length <= 1) return [arr];
                const result = [];
                arr.forEach((item, idx) => {
                    const rest = [...arr.slice(0, idx), ...arr.slice(idx + 1)];
                    permutations(rest).forEach(p => result.push([item, ...p]));
                });
                return result;
            }

            let bestOrder;
            if (n <= 7) {
                const indices = spotItems.map((_, i) => i);
                let bestDist = Infinity;
                permutations(indices).forEach(order => {
                    const d = routeDistance(order);
                    if (d < bestDist) { bestDist = d; bestOrder = order; }
                });
            } else {
                let bestStartDist = Infinity;
                for (let start = 0; start < n; start++) {
                    const visited = new Array(n).fill(false);
                    const order = [start];
                    visited[start] = true;
                    for (let step = 1; step < n; step++) {
                        const current = spotItems[order[order.length - 1]];
                        let bestIdx = -1, bestD = Infinity;
                        spotItems.forEach((cand, idx) => {
                            if (!visited[idx]) {
                                const d = haversineDistance(current.lat, current.lng, cand.lat, cand.lng);
                                if (d < bestD) { bestD = d; bestIdx = idx; }
                            }
                        });
                        visited[bestIdx] = true;
                        order.push(bestIdx);
                    }
                    const d = routeDistance(order);
                    if (d < bestStartDist) { bestStartDist = d; bestOrder = order; }
                }
            }

            bestOrder.forEach((origIdx, pos) => {
                newSlots[spotIndices[pos]].item = spotItems[origIdx];
            });

            return newSlots;
        }

        // 위키백과 무료 API로 대표 사진을 검색 (API 키 불필요, 매칭 실패 시 아이콘 폴백)
        const imageCache = {};
        function useWikiImage(title) {
            const [url, setUrl] = useState(imageCache.hasOwnProperty(title) ? imageCache[title] : undefined);

            useEffect(() => {
                if (!title) return;
                if (imageCache.hasOwnProperty(title)) {
                    setUrl(imageCache[title]);
                    return;
                }
                let cancelled = false;
                fetch(`https://ko.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)
                    .then(res => (res.ok ? res.json() : null))
                    .then(data => {
                        const src = (data && (data.thumbnail?.source || data.originalimage?.source)) || null;
                        imageCache[title] = src;
                        if (!cancelled) setUrl(src);
                    })
                    .catch(() => {
                        imageCache[title] = null;
                        if (!cancelled) setUrl(null);
                    });
                return () => { cancelled = true; };
            }, [title]);

            return url;
        }

        function PlaceImage({ title, category, className }) {
            const url = useWikiImage(title);
            const fallbackEmoji = category === 'food' ? '🍽️' : category === 'hotel' ? '🏨' : '📍';
            const cls = className || 'place-photo';
            if (url) {
                return <img src={url} alt={title} className={cls} loading="lazy" referrerPolicy="no-referrer" />;
            }
            return <div className={cls + ' place-photo-fallback'}>{fallbackEmoji}</div>;
        }

        // Leaflet(OSM) 실지도 위에 동선을 표시하는 컴포넌트
        function RouteMap({ items, dayId }) {
            const containerRef = useRef(null);
            const mapRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current || !window.L) return;
                if (!mapRef.current) {
                    mapRef.current = window.L.map(containerRef.current, { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(mapRef.current);
                }
                const map = mapRef.current;
                map.eachLayer(layer => {
                    if (!(layer instanceof window.L.TileLayer)) map.removeLayer(layer);
                });

                if (items && items.length > 0) {
                    const latlngs = items.map(i => [i.lat, i.lng]);
                    items.forEach((item, idx) => {
                        const icon = window.L.divIcon({
                            className: 'route-marker-icon',
                            html: `<div class="route-marker-num">${idx + 1}</div>`,
                            iconSize: [26, 26]
                        });
                        window.L.marker([item.lat, item.lng], { icon }).addTo(map);
                    });
                    if (latlngs.length >= 2) {
                        window.L.polyline(latlngs, { color: '#ff5a5f', weight: 3, dashArray: '6 6' }).addTo(map);
                        map.fitBounds(latlngs, { padding: [30, 30] });
                    } else {
                        map.setView(latlngs[0], 15);
                    }
                }
                setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 150);
            }, [JSON.stringify((items || []).map(i => [i.lat, i.lng]))]);

            useEffect(() => () => {
                if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
            }, []);

            return (
                <div className="route-map-wrap">
                    <div ref={containerRef} id={`map-${dayId}-${Math.random().toString(36).slice(2, 7)}`} className="route-map" />
                </div>
            );
        }

            const handleSlotDrop = (dayIdx, slotIdx) => {

                        setDraggedSlotRef(null);
                        return;

                    setSchedule(prev => {

                        const b = next[dayIdx].slots[slotIdx];
                        const tmp = a.item;
                        a.item = b.item;
                        b.item = tmp;
                        return next;
                    });
                    setDraggedSlotRef(null);
                    return;

                if (draggedItem) {
                    setSchedule(prev => {
                        const next = prev.map(day => ({ ...day, slots: day.slots.map(s => ({ ...s })) }));

            const totalPlacesCount = schedule.reduce((sum, d) => sum + d.slots.filter(s => s.item && s.type !== 'hotel').length, 0);
            const convertedTotal = convertCurrency(totalCost, selectedCity.currency, homeCurrency);

                                        <p className="setup-sub">빠른 선택 또는 직접 입력으로 원하는 기간을 정할 수 있습니다.</p>
                                        <div className="grid-options">
                                            {[2, 3, 4, 5, 7, 10].map(days => (
                                                <div
                                                    key={days}
                                                    className={`option-card ${durationDays === days ? 'active' : ''}`}
                                                    onClick={() => setDurationDays(days)}
                                                >
                                                    <div style={{ fontSize: '1.3rem', fontWeight: 900 }}>{days - 1}박 {days}일</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="custom-days-row">
                                            <span className="custom-days-label">직접 입력</span>
                                            <input
                                                type="number"
                                                min="1"
                                                max="30"
                                                value={durationDays}
                                                onChange={(e) => setDurationDays(Math.min(30, Math.max(1, Number(e.target.value) || 1)))}
                                            />
                                            <span style={{ fontWeight: 700 }}>{Math.max(0, durationDays - 1)}박 {durationDays}일</span>
                                        </div>
                                        <button className="btn-action" onClick={() => setStep(2)}>다음 단계로 ➔</button>
                                    </div>
                                )}

                                {step === 2 && (
                                    <div>
                                        <div className="step-badge">STEP 2 / 3</div>
                                        <h2 className="setup-title">여행자의 국적(통화)을 선택해주세요</h2>
                                        <p className="setup-sub">현지 경비를 선택하신 통화로 환산하여 보여드립니다.</p>
                                        <div className="grid-options">
                                            {Object.entries(CURRENCY_META).map(([code, meta]) => (
                                                <div
                                                    key={code}
                                                    className={`option-card ${homeCurrency === code ? 'active' : ''}`}
                                                    onClick={() => setHomeCurrency(code)}
                                                >
                                                    <div style={{ fontSize: '1rem', fontWeight: 800 }}>{meta.label}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <button className="btn-secondary" onClick={() => setStep(1)}>◀ 이전 단계</button>
                                        <button className="btn-action" onClick={() => setStep(3)}>다음 단계로 ➔</button>
                                    </div>
                                )}

                                {step === 3 && (
                                    <div>
                                        <div className="step-badge">STEP 3 / 3</div>
                                        <h2 className="setup-title">여행 설정을 완료했습니다!</h2>
                                        <p className="setup-sub">
                                            AI 동선 엔진이 {selectedCity.name} {durationDays - 1}박 {durationDays}일 플래너를 준비합니다.<br />
                                            경비는 {CURRENCY_META[homeCurrency].label} 기준으로 환산되어 표시됩니다.
                                        </p>
                                        <button className="btn-secondary" onClick={() => setStep(2)}>◀ 이전 단계</button>
                                        <button className="btn-action" onClick={finishSetup}>스마트 플래너 생성하기 🎉</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. 플래너 메인 뷰 */}
                        {view === 'planner' && (
                            <div>
                                {/* 실시간 5대 고민 안심 브리핑 카드 */}
                                <div className="hero-briefing">
                                    <div className="briefing-header">
                                        <div className="briefing-title">
                                            <h1>{selectedCity.name} {durationDays - 1}박 {durationDays}일 스마트 브리핑</h1>
                                            <p>장소를 변경할 때마다 이동시간과 예상 비용이 실시간으로 재계산됩니다.</p>
                                        </div>
                                        <div>
                                            <select className="currency-select" value={homeCurrency} onChange={(e) => setHomeCurrency(e.target.value)}>
                                                {Object.entries(CURRENCY_META).map(([code, meta]) => (
                                                    <option key={code} value={code}>{meta.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="briefing-grid">
                                        <div className="briefing-card">
                                            <div className="briefing-label">🏨 추천 거점 숙소</div>
                                            <div className="briefing-value" style={{ fontSize: '1.05rem' }}>{selectedCity.hub}</div>
                                            <a href={buildHotelUrl(selectedCity.agodaCity)} target="_blank" rel="noopener noreferrer" className="btn-cta-hotel">
                                                추천 최저가 숙소 보기 ➔
                                            </a>
                                        </div>
                                        <div className="briefing-card">
                                            <div className="briefing-label">💰 총 예상 경비 ({homeCurrency})</div>
                                            <div className="briefing-value">{formatMoney(convertedTotal, homeCurrency)}</div>
                                            <div className="briefing-subvalue">현지통화 {formatMoney(totalCost, selectedCity.currency)}</div>
                                        </div>
                                        <div className="briefing-card">
                                            <div className="briefing-label">📍 배치된 총 장소</div>
                                            <div className="briefing-value">{totalPlacesCount} 개</div>
                                        </div>
                                    </div>
                                </div>

                                {/* 플래너 메인 레이아웃 */}
                                <div className="planner-layout">
                                    {/* 사이드바: 추천 장소 & 추가 */}
                                    <div className="sidebar">
                                        <div className="section-title">🔍 장소 선택 및 추가</div>

                                        <input
                                            type="text"
                                            className="place-search-input"
                                            placeholder="관광지, 맛집 이름으로 검색..."
                                            value={placeSearch}
                                            onChange={(e) => setPlaceSearch(e.target.value)}
                                        />

                                        <div className="category-tabs">
                                            {[
                                                { id: 'all', label: '전체' },
                                                { id: 'spot', label: '📍 관광지/어트랙션' },
                                                { id: 'food', label: '🍽️ 맛집' }
                                            ].map(cat => (
                                                <button
                                                    key={cat.id}
                                                    className={`btn-tab ${categoryFilter === cat.id ? 'active' : ''}`}
                                                    onClick={() => setCategoryFilter(cat.id)}
                                                >
                                                    {cat.label}
                                                </button>
                                            ))}
                                        </div>

                                        <div style={{ fontSize: '0.8rem', color: 'var(--text-sub)', marginBottom: '12px' }}>
                                            💡 PC: 드래그 앤 드롭 / 모바일: 클릭 후 슬롯 터치 · 배치된 일정끼리도 클릭/드래그로 순서를 바꿀 수 있어요
                                        </div>

                                        {filteredPlaces.map(place => (
                                            <div
                                                key={place.id}
                                                className={`place-card-sm ${draggedItem?.id === place.id ? 'selected-tap' : ''}`}
                                                draggable
                                                onDragStart={() => { setDraggedItem(place); setDraggedSlotRef(null); }}
                                                onClick={() => setDraggedItem(draggedItem?.id === place.id ? null : place)}
                                            >
                                                <PlaceImage title={place.name} category={place.category} className="place-photo place-photo-sm" />
                                                <div style={{ fontWeight: 800, fontSize: '0.92rem' }}>{place.name}</div>
                                                <div style={{ fontSize: '0.78rem', color: 'var(--text-sub)', marginTop: '4px' }}>
                                                    ⏱️ {place.duration}분 | {formatMoney(place.cost, selectedCity.currency)}
                                                </div>
                                                {place.tip && (
                                                    <div style={{ fontSize: '0.75rem', color: 'var(--coral)', marginTop: '4px' }}>
                                                        💡 {place.tip}
                                                    </div>
                                                )}
                                            </div>
                                        ))}

                                        {filteredPlaces.length === 0 && (
                                            <div style={{ fontSize: '0.82rem', color: 'var(--text-sub)', textAlign: 'center', padding: '16px 0' }}>
                                                검색 결과가 없습니다. 아래에서 직접 추가해보세요.
                                            </div>
                                        )}

                                        {!showAddForm ? (
                                            <button className="btn-add-custom" onClick={() => setShowAddForm(true)}>+ 직접 장소 추가하기</button>
                                        ) : (
                                            <div className="custom-place-form">
                                                <input
                                                    placeholder="장소명"
                                                    value={newPlaceDraft.name}
                                                    onChange={(e) => setNewPlaceDraft({ ...newPlaceDraft, name: e.target.value })}
                                                />
                                                <div className="custom-place-form-row">
                                                    <select
                                                        value={newPlaceDraft.category}
                                                        onChange={(e) => setNewPlaceDraft({ ...newPlaceDraft, category: e.target.value })}
                                                    >
                                                        <option value="spot">📍 관광지</option>
                                                        <option value="food">🍽️ 맛집</option>
                                                    </select>
                                                    <input
                                                        type="number"
                                                        placeholder="소요시간(분)"
                                                        value={newPlaceDraft.duration}
                                                        onChange={(e) => setNewPlaceDraft({ ...newPlaceDraft, duration: e.target.value })}
                                                    />
                                                </div>
                                                <input
                                                    type="number"
                                                    placeholder={`예상 비용 (${selectedCity.currency})`}
                                                    value={newPlaceDraft.cost}
                                                    onChange={(e) => setNewPlaceDraft({ ...newPlaceDraft, cost: e.target.value })}
                                                />
                                                <input
                                                    placeholder="한줄 팁 (선택)"
                                                    value={newPlaceDraft.tip}
                                                    onChange={(e) => setNewPlaceDraft({ ...newPlaceDraft, tip: e.target.value })}
                                                />
                                                <button className="btn-form-submit" onClick={submitCustomPlace}>추가하기</button>
                                            </div>
                                        )}
                                    </div>

                                    {/* 메인 일자별 타임라인 Area */}
                                    <div className="timeline-container" id="printable-area">
                                        {schedule.map((dayData, dayIdx) => {
                                            const routeItems = dayData.slots.filter(s => s.type !== 'hotel' && s.item).map(s => s.item);
                                            const spotCount = dayData.slots.filter(s => s.item && s.item.category === 'spot').length;

                                            return (
                                                <div key={dayData.day} style={{ marginBottom: '36px' }}>
                                                    <div className="day-header">
                                                        <div className="day-title">DAY {dayData.day} 일정</div>
                                                        <button
                                                            className="btn-optimize"
                                                            onClick={() => handleOptimize(dayIdx)}
                                                            disabled={spotCount < 2}
                                                            title={spotCount < 2 ? '관광지를 2곳 이상 배치하면 활성화됩니다' : '관광지 방문 순서를 최단 동선으로 재배열합니다'}
                                                        >
                                                            🧭 동선 최적화 실행
                                                        </button>
                                                    </div>

                                                    {/* 동선 요약 실지도 */}
                                                    {routeItems.length > 0 && (
                                                        <RouteMap items={routeItems} dayId={dayData.day} />
                                                    )}

                                                    {dayData.slots.map((slot, slotIdx) => {
                                                        const nextSlot = dayData.slots[slotIdx + 1];
                                                        const transit = (slot.item && slot.type !== 'hotel' && nextSlot && nextSlot.item && nextSlot.type !== 'hotel')
                                                            ? calculateTransit(slot.item, nextSlot.item) : null;
                                                        const isPicked = draggedSlotRef && draggedSlotRef.dayIdx === dayIdx && draggedSlotRef.slotIdx === slotIdx;

                                                        return (
                                                            <React.Fragment key={slotIdx}>
                                                                <div
                                                                    className={`slot-card ${slot.item ? 'has-item' : ''} ${isPicked ? 'slot-picked' : ''}`}
                                                                    draggable={!!slot.item && slot.type !== 'hotel'}
                                                                    onDragStart={() => { if (slot.type !== 'hotel') { setDraggedSlotRef({ dayIdx, slotIdx }); setDraggedItem(null); } }}
                                                                    onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                                                                    onDragLeave={(e) => e.currentTarget.classList.remove('drag-over')}
                                                                    onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); handleSlotDrop(dayIdx, slotIdx); }}
                                                                    onClick={() => handleSlotClick(dayIdx, slotIdx, slot)}
                                                                >
                                                                    <div className="slot-meta">
                                                                        <span className="slot-time-label">
                                                                            ⏰
                                                                            <input
                                                                                className="inline-input time-input"
                                                                                value={slot.time}
                                                                                onClick={(e) => e.stopPropagation()}
                                                                                onChange={(e) => updateSlotField(dayIdx, slotIdx, 'time', e.target.value)}
                                                                            />
                                                                            <input
                                                                                className="inline-input label-input"
                                                                                value={slot.label}
                                                                                onClick={(e) => e.stopPropagation()}
                                                                                onChange={(e) => updateSlotField(dayIdx, slotIdx, 'label', e.target.value)}
                                                                            />
                                                                        </span>
                                                                        <div className="slot-meta-actions">
                                                                            {slot.item && slot.type !== 'hotel' && (
                                                                                <span className="stay-duration">권장 체류: {slot.item.duration}분</span>
                                                                            )}
                                                                            {slot.item && slot.type !== 'hotel' && (
                                                                                <button
                                                                                    className="btn-icon-action"
                                                                                    onClick={(e) => { e.stopPropagation(); handleRemoveSlot(dayIdx, slotIdx); }}
                                                                                    title="이 항목 비우기"
                                                                                >
                                                                                    ✕
                                                                                </button>
                                                                            )}
                                                                            {!slot.fixed && (
                                                                                <button
                                                                                    className="btn-icon-action"
                                                                                    onClick={(e) => { e.stopPropagation(); removeSlotRow(dayIdx, slotIdx); }}
                                                                                    title="이 일정 칸 삭제"
                                                                                >
                                                                                    🗑
                                                                                </button>
                                                                            )}
                                                                        </div>
                                                                    </div>

                                                                    {slot.type === 'hotel' ? (
                                                                        <div className="hotel-slot" onClick={(e) => e.stopPropagation()}>
                                                                            <input
                                                                                className="hotel-name-input"
                                                                                placeholder="🏨 예약한 숙소명을 입력하세요"
                                                                                value={slot.item?.name || ''}
                                                                                onChange={(e) => updateSlotField(dayIdx, slotIdx, 'item', { ...(slot.item || { cost: 0 }), name: e.target.value, category: 'hotel' })}
                                                                            />
                                                                            <div className="hotel-cost-row">
                                                                                <span>1박 요금</span>
                                                                                <input
                                                                                    type="number"
                                                                                    className="hotel-cost-input"
                                                                                    value={slot.item?.cost || 0}
                                                                                    onChange={(e) => updateSlotField(dayIdx, slotIdx, 'item', { ...(slot.item || { name: '' }), cost: Number(e.target.value) || 0, category: 'hotel' })}
                                                                                />
                                                                                <span>{selectedCity.currency}</span>
                                                                            </div>
                                                                            {slot.item?.name && <PlaceImage title={slot.item.name} category="hotel" className="place-photo" />}
                                                                            <a href={buildHotelUrl(selectedCity.agodaCity)} target="_blank" rel="noopener noreferrer" className="affiliate-link" onClick={(e) => e.stopPropagation()}>
                                                                                🏨 아고다에서 숙소 재확인/예약하기
                                                                            </a>
                                                                        </div>
                                                                    ) : slot.item ? (
                                                                        <div>
                                                                            <PlaceImage title={slot.item.name} category={slot.type} className="place-photo" />
                                                                            <div className="slot-name">{slot.item.name}</div>
                                                                            <div className="slot-cost">
                                                                                예상 비용: {formatMoney(slot.item.cost, selectedCity.currency)}
                                                                                <span className="slot-cost-converted"> (약 {formatMoney(convertCurrency(slot.item.cost, selectedCity.currency, homeCurrency), homeCurrency)})</span>
                                                                            </div>

                                                                            {slot.item.category === 'spot' && slot.item.highlights && slot.item.highlights.length > 0 && (
                                                                                <ul className="highlight-list">
                                                                                    {slot.item.highlights.map((h, i) => <li key={i}>✔ {h}</li>)}
                                                                                </ul>
                                                                            )}

                                                                            {slot.item.category === 'food' && slot.item.menu && slot.item.menu.length > 0 && (
                                                                                <div className="menu-list">
                                                                                    <div className="menu-list-title">🍴 대표 메뉴</div>
                                                                                    <div className="menu-chips">
                                                                                        {slot.item.menu.map((m, i) => <span key={i} className="menu-chip">{m}</span>)}
                                                                                    </div>
                                                                                </div>
                                                                            )}

                                                                            {slot.item.tip && <div className="slot-tip">💡 {slot.item.tip}</div>}

                                                                            {slot.item.bookable && (
                                                                                <a href={buildTicketUrl(slot.item.name)} target="_blank" rel="noopener noreferrer" className="affiliate-link" onClick={(e) => e.stopPropagation()}>
                                                                                    🎟️ Klook에서 최저가 티켓 확인하기
                                                                                </a>
                                                                            )}
                                                                        </div>
                                                                    ) : (
                                                                        <div className="empty-slot-hint">
                                                                            {draggedItem
                                                                                ? '👇 클릭/드롭하여 장소 배치하기'
                                                                                : draggedSlotRef
                                                                                    ? '👇 클릭하여 이 위치와 순서 바꾸기'
                                                                                    : '+ 장소를 드래그/클릭하여 추가하거나, 배치된 다른 일정을 클릭해 순서를 바꿔보세요'}
                                                                        </div>
                                                                    )}
                                                                </div>

                                                                {/* 이동 시간 배지 */}
                                                                {transit && (
                                                                    <div className="transit-badge">
                                                                        <div className="transit-line"></div>
                                                                        <span>{transit.mode} 약 {transit.mins}분 이동 ({transit.km.toFixed(1)}km)</span>
                                                                        <div className="transit-line"></div>
                                                                    </div>
                                                                )}
                                                            </React.Fragment>
                                                        );
                                                    })}

                                                    <button className="btn-add-slot" onClick={() => addSlot(dayIdx)}>+ 일정 칸 추가</button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* 하단 고정 요약 및 Export 패널 */}
                                <div className="summary-panel">
                                    <div style={{ fontWeight: 800, fontSize: '1.1rem', marginBottom: '8px' }}>📥 여행 완성 및 내보내기</div>
                                    <div style={{ fontSize: '0.85rem', color: '#94a3b8' }}>
                                        총 {totalPlacesCount}개 장소 배치됨 | 예산: {formatMoney(convertedTotal, homeCurrency)} ({formatMoney(totalCost, selectedCity.currency)})
                                    </div>
                                    <button className="btn-download" onClick={handlePDFExport} disabled={isGeneratingPDF}>
                                        {isGeneratingPDF ? '⌛ PDF 생성 중...' : '📄 일정표 PDF 다운로드 ($1.99)'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
